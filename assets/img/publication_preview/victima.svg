<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f7fafc"/><stop offset="1" stop-color="#eef3f8"/>
  </linearGradient>
  <linearGradient id="data" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#d3dde8"/><stop offset="1" stop-color="#c1cdda"/>
  </linearGradient>
  <linearGradient id="tlb" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f4936f"/><stop offset="1" stop-color="#e5673f"/>
  </linearGradient>
  <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#3b82c4"/><stop offset="1" stop-color="#2a5f96"/>
  </linearGradient>
  <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#f2c14e" stop-opacity="0.55"/>
    <stop offset="1" stop-color="#f2c14e" stop-opacity="0"/>
  </radialGradient>
  <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#16233b" flood-opacity="0.20"/>
  </filter>
  <marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
    <path d="M0,0 L6,3 L0,6 Z" fill="#2a5f96"/>
  </marker>
  <clipPath id="rc"><rect x="0" y="0" width="400" height="400" rx="30"/></clipPath>
</defs>
<g clip-path="url(#rc)">
  <rect x="0" y="0" width="400" height="400" fill="url(#bg)"/>

  <!-- title -->
  <text x="200" y="52" font-family="Georgia,serif" font-size="19" fill="#16233b" text-anchor="middle" opacity="0.85">L2 cache</text>

  <!-- last-level TLB chip feeding overflow entries into the cache -->
  <g filter="url(#sh)">
    <rect x="24" y="120" width="52" height="34" rx="7" fill="url(#chip)"/>
  </g>
  <text x="50" y="142" font-family="Georgia,serif" font-size="12" fill="#ffffff" text-anchor="middle">TLB</text>
  <path d="M78,150 C104,176 108,196 132,208" fill="none" stroke="#2a5f96" stroke-width="2.2"
        stroke-dasharray="5 5" stroke-linecap="round" marker-end="url(#arw)" opacity="0.85"/>

  <!-- glows behind repurposed blocks -->
  <circle cx="154" cy="230" r="52" fill="url(#glow)"/>
  <circle cx="330" cy="140" r="46" fill="url(#glow)"/>
  <circle cx="286" cy="326" r="44" fill="url(#glow)"/>

  <!-- ==== cache grid ==== -->
  <!-- row 0 -->
  <g><rect x="128" y="78" width="44" height="44" rx="7" fill="url(#data)"/><line x1="136" y1="100" x2="164" y2="100" stroke="#8ba0b6" stroke-width="2" opacity="0.5"/></g>
  <g><rect x="182" y="78" width="44" height="44" rx="7" fill="url(#data)"/><line x1="190" y1="100" x2="218" y2="100" stroke="#8ba0b6" stroke-width="2" opacity="0.5"/></g>
  <g><rect x="236" y="78" width="44" height="44" rx="7" fill="url(#data)"/><line x1="244" y1="100" x2="272" y2="100" stroke="#8ba0b6" stroke-width="2" opacity="0.5"/></g>
  <g filter="url(#sh)"><rect x="290" y="78" width="44" height="44" rx="7" fill="url(#tlb)"/><line x1="298" y1="90" x2="326" y2="90" stroke="#fff" stroke-width="2" opacity="0.85"/><line x1="298" y1="100" x2="326" y2="100" stroke="#fff" stroke-width="2" opacity="0.85"/><line x1="298" y1="110" x2="326" y2="110" stroke="#fff" stroke-width="2" opacity="0.85"/></g>

  <!-- row 1 -->
  <g><rect x="128" y="132" width="44" height="44" rx="7" fill="url(#data)"/><line x1="136" y1="154" x2="164" y2="154" stroke="#8ba0b6" stroke-width="2" opacity="0.5"/></g>
  <g><rect x="182" y="132" width="44" height="44" rx="7" fill="url(#data)"/><line x1="190" y1="154" x2="218" y2="154" stroke="#8ba0b6" stroke-width="2" opacity="0.5"/></g>
  <g><rect x="236" y="132" width="44" height="44" rx="7" fill="url(#data)"/><line x1="244" y1="154" x2="272" y2="154" stroke="#8ba0b6" stroke-width="2" opacity="0.5"/></g>
  <g filter="url(#sh)"><rect x="290" y="132" width="44" height="44" rx="7" fill="url(#tlb)"/><line x1="298" y1="144" x2="326" y2="144" stroke="#fff" stroke-width="2" opacity="0.85"/><line x1="298" y1="154" x2="326" y2="154" stroke="#fff" stroke-width="2" opacity="0.85"/><line x1="298" y1="164" x2="326" y2="164" stroke="#fff" stroke-width="2" opacity="0.85"/></g>

  <!-- row 2 -->
  <g filter="url(#sh)"><rect x="128" y="186" width="44" height="44" rx="7" fill="url(#tlb)"/><line x1="136" y1="198" x2="164" y2="198" stroke="#fff" stroke-width="2" opacity="0.85"/><line x1="136" y1="208" x2="164" y2="208" stroke="#fff" stroke-width="2" opacity="0.85"/><line x1="136" y1="218" x2="164" y2="218" stroke="#fff" stroke-width="2" opacity="0.85"/></g>
  <g><rect x="182" y="186" width="44" height="44" rx="7" fill="url(#data)"/><line x1="190" y1="208" x2="218" y2="208" stroke="#8ba0b6" stroke-width="2" opacity="0.5"/></g>
  <g><rect x="236" y="186" width="44" height="44" rx="7" fill="url(#data)"/><line x1="244" y1="208" x2="272" y2="208" stroke="#8ba0b6" stroke-width="2" opacity="0.5"/></g>
  <g><rect x="290" y="186" width="44" height="44" rx="7" fill="url(#data)"/><line x1="298" y1="208" x2="326" y2="208" stroke="#8ba0b6" stroke-width="2" opacity="0.5"/></g>

  <!-- row 3 -->
  <g filter="url(#sh)"><rect x="128" y="240" width="44" height="44" rx="7" fill="url(#tlb)"/><line x1="136" y1="252" x2="164" y2="252" stroke="#fff" stroke-width="2" opacity="0.85"/><line x1="136" y1="262" x2="164" y2="262" stroke="#fff" stroke-width="2" opacity="0.85"/><line x1="136" y1="272" x2="164" y2="272" stroke="#fff" stroke-width="2" opacity="0.85"/></g>
  <g><rect x="182" y="240" width="44" height="44" rx="7" fill="url(#data)"/><line x1="190" y1="262" x2="218" y2="262" stroke="#8ba0b6" stroke-width="2" opacity="0.5"/></g>
  <g><rect x="236" y="240" width="44" height="44" rx="7" fill="url(#data)"/><line x1="244" y1="262" x2="272" y2="262" stroke="#8ba0b6" stroke-width="2" opacity="0.5"/></g>
  <g><rect x="290" y="240" width="44" height="44" rx="7" fill="url(#data)"/><line x1="298" y1="262" x2="326" y2="262" stroke="#8ba0b6" stroke-width="2" opacity="0.5"/></g>

  <!-- row 4 -->
  <g><rect x="128" y="294" width="44" height="44" rx="7" fill="url(#data)"/><line x1="136" y1="316" x2="164" y2="316" stroke="#8ba0b6" stroke-width="2" opacity="0.5"/></g>
  <g><rect x="182" y="294" width="44" height="44" rx="7" fill="url(#data)"/><line x1="190" y1="316" x2="218" y2="316" stroke="#8ba0b6" stroke-width="2" opacity="0.5"/></g>
  <g filter="url(#sh)"><rect x="236" y="294" width="44" height="44" rx="7" fill="url(#tlb)"/><line x1="244" y1="306" x2="272" y2="306" stroke="#fff" stroke-width="2" opacity="0.85"/><line x1="244" y1="316" x2="272" y2="316" stroke="#fff" stroke-width="2" opacity="0.85"/><line x1="244" y1="326" x2="272" y2="326" stroke="#fff" stroke-width="2" opacity="0.85"/></g>
  <g><rect x="290" y="294" width="44" height="44" rx="7" fill="url(#data)"/><line x1="298" y1="316" x2="326" y2="316" stroke="#8ba0b6" stroke-width="2" opacity="0.5"/></g>

  <!-- legend -->
  <rect x="128" y="360" width="15" height="15" rx="3" fill="url(#tlb)"/>
  <text x="150" y="372" font-family="Georgia,serif" font-size="13" fill="#16233b" opacity="0.78">TLB entries</text>
  <rect x="236" y="360" width="15" height="15" rx="3" fill="url(#data)"/>
  <text x="258" y="372" font-family="Georgia,serif" font-size="13" fill="#16233b" opacity="0.78">cache blocks</text>
</g>
<rect x="1" y="1" width="398" height="398" rx="29" fill="none" stroke="#16233b" stroke-opacity="0.10" stroke-width="2"/>
</svg>
